<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#102e35">
  <title>เปิดระบบ SKB People</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;background:#f5f7f5;color:#183238;font-family:Arial,sans-serif}.card{width:100%;max-width:440px;text-align:center;background:#fff;border:1px solid #e4eae7;border-radius:18px;padding:34px 24px;box-shadow:0 8px 30px rgba(20,50,50,.08)}.mark{width:56px;height:56px;margin:0 auto 18px;border-radius:15px;background:#dff3ea;color:#087e70;display:grid;place-items:center;font-size:19px;font-weight:700}h1{font-size:24px;margin:0 0 9px}p{font-size:15px;color:#6f8382;line-height:1.7;margin:0 0 22px}.open{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:0 22px;border-radius:10px;background:#087e70;color:#fff;text-decoration:none;font-size:17px;font-weight:600}.open:active{background:#076c60}.note{margin:18px 0 0;padding-top:17px;border-top:1px solid #e8eeeb;color:#849492;font-size:12px;line-height:1.75}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">SKB</div>
    <h1>ระบบ SKB People</h1>
    <p>กดปุ่มด้านล่างเพื่อเปิดแบบฟอร์มอัปเดตข้อมูลพนักงาน</p>
    <a class="open" href="https://script.google.com/macros/s/AKfycbzmwAMt5ojtRbK-sl7qJ1SO7R59r-721Cst8md0lZTTfjlss9gUK0jyYw2KiKaFoA2a/exec?source=skb-portal">เปิดแบบฟอร์ม</a>
    <div class="note">หน้าเว็บจะเปิดเมื่อท่านกดปุ่มโดยตรง เพื่อให้ Safari และ Chrome อนุญาตการเชื่อมต่อกับ Google Apps Script</div>
  </main>
</body>
</html>
